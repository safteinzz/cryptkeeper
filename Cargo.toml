[package]
name = "easygocryptfs"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "gocryptfs without the flags - lock and unlock encrypted folders from wherever you stand"
authors = ["Pablo Antonio Hernández Hernández (safteinzz)"]
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://gitlab.com/safteinzz/easygocryptfs"
keywords = ["gocryptfs", "encryption", "vault", "cli"]
categories = ["command-line-utilities", "cryptography"]
exclude = ["readme-assets/", "demo/"]

[[bin]]
name = "egc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap   = { version = "4", features = ["derive"] }
ctrlc  = "3"
dirs   = "5"
